name: Deploy to GitHub Pages with Tests

on:
  push:
    [cite_start]branches: ["main", "master"] # Тригер on: push запускає workflow при кожному push [cite: 213]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Завантаження коду
        uses: actions/checkout@v4
      - name: Налаштування Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          [cite_start]cache: 'npm' # Кешує папку node_modules між запусками [cite: 215]
      - name: Встановлення залежностей
        [cite_start]run: npm ci # Строго дотримується файлу package-lock.json [cite: 216]
      - name: Встановлення браузерів Playwright
        run: npx playwright install --with-deps chromium
      - name: Запуск Е2Е тестів
        run: npx playwright test
      - name: Збереження звіту Playwright
        uses: actions/upload-artifact@v4
        [cite_start]if: always() # Зберігає артефакт навіть при падінні тестів [cite: 214]
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 10

  deploy:
    name: Deploy to GitHub Pages
    [cite_start]needs: test # Деплой буде заблоковано, якщо хоча б один тест впаде [cite: 209]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Завантаження коду
        uses: actions/checkout@v4
      - name: Налаштування Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Встановлення залежностей
        run: npm ci
      - name: Збірка Vue проєкту
        run: npm run build # Збираємо Vue проєкт у папку dist
      - name: Налаштування GitHub Pages
        uses: actions/configure-pages@v5
      - name: Завантаження артефактів для Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Вказуємо папку dist після збірки Vue
      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4